<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Ajouter un masque</title>
</head>
<body>
    <form method="POST" th:object="${element}">
        <label for="createur">Nom du créateur :</label>
        <input type="text" id="createur" th:field="*{nomCreateur}" required/><br>

        <label for="theme">Theme :</label>
        <input type="text" id="theme" th:field="*{theme}" required/><br>

        <label for="prixFabrication">Prix de fabrication :</label>
        <input type="number" step="0.01" id="prixFabrication" th:field="*{prixFabrication}" required/><br>

        <label for="nbVotes">Nombre de votes :</label>
        <input type="text" id="nbVotes" th:field="*{nbVotes}" required/><br>

        <button type="submit">Enregistrer</button>
    </form>

    <a th:href="@{/masque}">Retour a la liste</a>
</body>
</html>
