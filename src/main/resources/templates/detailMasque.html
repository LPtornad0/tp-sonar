<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Detail du masque</title>
</head>
<body>
  <form th:object="${m}">
    <label for="id">ID :</label>
    <input type="number" id="id" th:field="*{id}" disabled/><br>

    <label for="createur">Nom du créateur :</label>
    <input type="text" id="createur" th:field="*{nomCreateur}" disabled/><br>

    <label for="theme">Theme :</label>
    <input type="text" id="theme" th:field="*{theme}" disabled/><br>

    <label for="prixFabrication">Prix de fabrication :</label>
    <input type="number" step="0.01" id="prixFabrication" th:field="*{prixFabrication}" disabled/><br>

    <label for="nbVotes">Nombre de votes :</label>
    <input type="text" id="nbVotes" th:field="*{nbVotes}" disabled/><br>
  </form>

  <a th:href="@{/masque}">Retour a la liste</a>
</body>
</html>
